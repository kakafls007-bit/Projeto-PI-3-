<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login do profissional</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header center-header">
      <a href="index.html" class="back-btn" data-fallback="index.html"></a>
      <div class="logo">
        <span class="logo-icon"></span>
        <span>nome</span>
      </div>
    </header>

    <main class="app-body center">
      <p class="intro-text">Área do profissional</p>

      <form id="login-profissional-form">
        <div class="field">
          <label for="registro">Registro profissional (CRM/COREN)</label>
          <input type="text" id="registro" name="registro" required />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required />
        </div>

        <div class="spacer"></div>

        <div class="bottom-area">
          <button type="submit" class="btn">Entrar</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
