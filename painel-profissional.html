<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do profissional</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header header-compact">
      <a href="login-profissional.html" class="back-btn" data-fallback="login-profissional.html"></a>
      <div class="logo logo-inline">
        <span class="logo-icon"></span>
        <span>nome</span>
      </div>
    </header>

    <main class="app-body">
      <p class="intro-text left">Suas consultas</p>

      <div class="tabs" id="painel-tabs">
        <button type="button" class="tab-btn active" data-tab="lista-aguardando">Aguardando</button>
        <button type="button" class="tab-btn" data-tab="lista-concluidas">Concluídas</button>
      </div>

      <div class="tab-panel active" id="lista-aguardando"></div>
      <div class="tab-panel" id="lista-concluidas"></div>

      <a class="logout-link" href="login-profissional.html">sair</a>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
